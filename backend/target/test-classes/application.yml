spring:
  application:
    name: skillswap-platform-test
  datasource:
    url: jdbc:h2:mem:skillswap_test;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        format_sql: false
  flyway:
    enabled: false

server:
  port: 0
